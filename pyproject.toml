[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xinyu-mcp-cli"
version = "0.1.0"
description = "心屿后端 MCP 聚合 CLI — 安装后 Claude Code 即可用自然语言操作角色/星梦/用户等后端服务"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "xinyu-team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = ["mcp", "claude-code", "ai", "tools", "xinyu"]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://yulidev-ap-southeast-1.devops.alibabacloudcs.com/codeup/yuliyuli"
Repository = "https://yulidev-ap-southeast-1.devops.alibabacloudcs.com/codeup/yuliyuli.git"

[project.scripts]
xinyu-mcp = "xinyu_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/xinyu_mcp"]
